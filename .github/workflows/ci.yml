# CI for ha-gamified-gtd: runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Integration metadata validation: manifest, hacs.json, services.yaml <-> const.py,
  # strings/translations consistency, all Python files compile.
  validate:
    name: Validate integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run validation script
        run: python scripts/validate_integration.py

  # Unit tests for the pure FNV gamification logic (XP curve, skills, perks, ...).
  test:
    name: Unit tests (gamification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/test_gamification.py tests/test_goat.py tests/test_frontend_assets.py -q

  # Smoke test: import all integration modules with a real Home Assistant install,
  # so import errors (e.g. circular imports) that break the config flow are caught.
  import-smoke:
    name: Import smoke test (HA installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install homeassistant + pytest
        run: pip install homeassistant pytest
      - name: Run import smoke + setup tests
        run: python -m pytest tests/test_imports.py tests/test_setup.py tests/test_todo.py tests/test_manager.py -q

  # Frontend: syntax-check the custom card module (ES module -> node --check).
  frontend:
    name: Card JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check card modules
        run: |
          cp custom_components/gamified_gtd/www/gamified-gtd-cards.js /tmp/cards.mjs
          cp custom_components/gamified_gtd/www/gamified-gtd-lit.js /tmp/lit-bundle.mjs
          node --check /tmp/cards.mjs
          node --check /tmp/lit-bundle.mjs
